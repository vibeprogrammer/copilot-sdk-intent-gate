name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and recorded end-to-end tests (no model, no keys, no IndyKite tenant)
        run: pytest -q
      - name: Results script loads and scores the committed transcripts
        run: python scripts/summarize.py results/*.jsonl > /dev/null
      - name: Every recorded PDP decision matches the demo policy rules
        run: python scripts/check_pdp_agreement.py results/*.jsonl

  openfga:
    # The gate against a real open-source AuthZEN engine: OpenFGA's release binary, in-memory store.
    # Intent-agent's answers are the recorded ones, so no model, key or IndyKite tenant is needed.
    runs-on: ubuntu-latest
    env:
      OPENFGA_VERSION: "1.22.1"
      FGA_CLI_VERSION: "0.8.2"
      OPENFGA_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download OpenFGA and the FGA CLI (checksums verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          base=https://github.com/openfga
          curl -fsSLO "$base/openfga/releases/download/v${OPENFGA_VERSION}/openfga_${OPENFGA_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o openfga.sums "$base/openfga/releases/download/v${OPENFGA_VERSION}/checksums.txt"
          grep " openfga_${OPENFGA_VERSION}_linux_amd64.tar.gz$" openfga.sums | sha256sum -c -
          curl -fsSLO "$base/cli/releases/download/v${FGA_CLI_VERSION}/fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o fga.sums "$base/cli/releases/download/v${FGA_CLI_VERSION}/checksums.txt"
          grep " fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz$" fga.sums | sha256sum -c -
          tar xzf "openfga_${OPENFGA_VERSION}_linux_amd64.tar.gz" openfga
          tar xzf "fga_${FGA_CLI_VERSION}_linux_amd64.tar.gz" fga
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Policy tests in OpenFGA's own format
        run: fga model test --tests pdp/openfga/store.fga.yaml
      - name: model.json is the JSON form of model.fga
        run: |
          fga model transform --file pdp/openfga/model.fga > /tmp/model.json
          python -c "import json,sys; a,b=(json.load(open(p)) for p in sys.argv[1:]); sys.exit(a!=b)" /tmp/model.json pdp/openfga/model.json
      - name: Start OpenFGA with the AuthZEN API
        run: |
          openfga run --datastore-engine memory --experimentals=authzen --playground-enabled=false \
            --metrics-enabled=false > /tmp/openfga.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: The gate with OpenFGA as its PDP
        run: pytest -q -m openfga -rs
      - name: OpenFGA log on failure
        if: failure()
        run: cat /tmp/openfga.log
